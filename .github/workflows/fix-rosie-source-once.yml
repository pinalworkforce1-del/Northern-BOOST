name: Fix Rosie source once

on:
  push:
    paths:
      - '.github/workflows/fix-rosie-source-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Point Rosie to clean web video and remove broken asset
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          text = p.read_text(encoding='utf-8')
          old = 'assets/video/rosie-boost-intro.mp4'
          new = 'assets/video/rosie-boost-intro-web.mp4?v=20260910rosiefix1'
          if old not in text:
              raise SystemExit('Old Rosie source not found in site/index.html')
          text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
          rm -f site/assets/video/rosie-boost-intro.mp4
          rm -f .github/workflows/fix-rosie-source-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Northern Rosie intro playback'
          git push origin HEAD:main
