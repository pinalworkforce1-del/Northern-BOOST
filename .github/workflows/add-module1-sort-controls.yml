name: Add Northern Module 1 sort controls
on:
  push:
    branches: [main]
    paths:
      - 'tools/add_module1_sort_controls.py'
      - '.github/workflows/add-module1-sort-controls.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add career sort controls
        run: python tools/add_module1_sort_controls.py
      - name: Commit sort controls
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/Northern_BOOST_Module1_PinalFlow_v1.html site/assets/js/northern-module1-pinalflow-v1.js
          if git diff --cached --quiet; then
            echo 'No sort-control changes.'
            exit 0
          fi
          git commit -m 'Add career evidence sort controls to Northern Module 1'
          git push
