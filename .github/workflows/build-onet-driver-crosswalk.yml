name: Build O*NET driver crosswalk
on:
  push:
    branches: [main]
    paths:
      - 'tools/build_onet_driver_crosswalk.py'
      - '.github/workflows/build-onet-driver-crosswalk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact O*NET 31.0 driver crosswalk
        run: python tools/build_onet_driver_crosswalk.py
      - name: Commit generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/assets/data/northern-onet-driver-crosswalk-v1.js
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Build O*NET 31.0 BOOST driver crosswalk'
          git push
