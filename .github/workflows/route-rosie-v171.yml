name: Route Northern Rosie v17.1

on:
  push:
    paths:
      - '.github/workflows/route-rosie-v171.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Route Rosie endpoint
        shell: python
        run: |
          from pathlib import Path
          p = Path('site/assets/js/northern-ask-rosie-v1.js')
          old = "https://dxcajwarqojvmbteroco.supabase.co/functions/v1/boost-ask-rosie-northern"
          new = "https://dxcajwarqojvmbteroco.supabase.co/functions/v1/boost-ask-rosie-northern-v171"
          s = p.read_text()
          if new in s:
              print('Already routed to v17.1')
          elif old in s:
              p.write_text(s.replace(old, new, 1))
              print('Routed Northern Rosie to v17.1')
          else:
              raise SystemExit('Expected Northern Rosie endpoint not found; no file changed.')
      - name: Commit route change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/js/northern-ask-rosie-v1.js
          git commit -m "Route Northern Rosie through v17.1 safety wrapper"
          git push
