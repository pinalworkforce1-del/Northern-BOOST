<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI & You | Northern BOOST</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef3f5;font-family:Arial,sans-serif}#aiFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#eef3f5}.loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#0d2741;color:#fff;text-align:center;padding:24px}.loading.hidden{display:none}.loadingCard{max-width:520px}.loadingCard b{display:block;font-size:22px;margin-bottom:8px;color:#f4bd2f}.loadingCard span{line-height:1.5;color:#dce9f1}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/northern-occupation-master-v1.js?v=20260916ai1"></script>
</head>
<body>
<iframe id="aiFrame" title="Northern BOOST — AI & You"></iframe>
<div class="loading" id="loading"><div class="loadingCard"><b>Loading AI & You…</b><span>Connecting this shared BOOST experience to your Northern Arizona journey and Rosie.</span></div></div>
<script>
(()=>{'use strict';
const JK='boost_naz_journey_v1',PK='boost_naz_portal_progress_v1',PATH='boost_naz_pathway_v1';
const URL_BASE='https://pinalworkforce1-del.github.io/AI_Literacy/ai-you-v2.html';
const SUPABASE_URL='https://dxcajwarqojvmbteroco.supabase.co';
const SUPABASE_ANON='sb_publishable_ehUKOOksq5SlkTNb-wQ8ZA_Zh8XlWDF';
const ENDPOINT='boost-ask-rosie-northern-v171';
const frame=document.getElementById('aiFrame'),loading=document.getElementById('loading');
let client=null,masterPromise=null;
function read(k,f={}){try{return JSON.parse(localStorage.getItem(k)||'null')||f}catch{return f}}
function journey(){return read(JK,{})}
function portal(){return read(PK,{})}
function career(){
 const j=journey(),m=j.module4||j.modules?.module4||{},ref=m.careerTarget||m.targetCareer||m.career||m.selection?.career||{};
 const soc=String(m.selectedSoc||m.soc||ref.soc||''),title=m.careerTitle||m.title||ref.title||'';
 const route=String(m.route||m.participantDirection||m.decision?.code||m.boostSignal?.result||'').toUpperCase();
 return soc||title?{soc,title:title||soc,route}:null;
}
function scenarioFor(c){if(!c)return null;const p=String(c.soc||'').replace(/\D/g,'').slice(0,2),t=String(c.title||'').toLowerCase();if(p==='15'||/computer|software|cyber|network|information technology|user support|help desk|technical support/.test(t))return'it';if(['29','31'].includes(p)||/nurs|medical|health|clinical|patient|pharmacy|dental/.test(t))return'health';if(p==='51'||/manufactur|production|cnc|machinist|fabricat/.test(t))return'mfg';if(['47','49'].includes(p)||/electric|plumb|hvac|weld|construction|carpent|maintenance|repair|solar/.test(t))return'trades';if(p==='53'||/truck|cdl|transport|logistic|warehouse|delivery/.test(t))return'transport';if(/retail|customer service|sales|cashier/.test(t))return'retail';return null}
function getClient(){if(!client)client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});return client}
async function loadMaster(){if(!masterPromise)masterPromise=window.NORTHERN_OCC_MASTER.load();return masterPromise}
function occShape(o){if(!o)return null;return{soc:String(o.soc||''),title:o.title||'',jobsCurrent:o.jobs,jobsProjected:o.jobs2035,annualOpenings:o.annualOpenings,growthPct:o.growthPercent,p25Hourly:o.wage25,medianHourly:o.wageMedian,p75Hourly:o.wage75,education:o.typicalEntryEducation,experience:o.workExperienceRequired,ojt:o.typicalOnTheJobTraining,passesRecommendationGate:!!o.passesRecommendationGate,regionalOpportunityLabel:o.regionalOpportunityLabel||'',geography:'Apache, Coconino, Gila & Navajo Counties, Arizona'}}
async function focusOccupation(){const c=career();if(!c)return null;try{const m=await loadMaster(),digits=String(c.soc||'').replace(/\D/g,'').slice(0,6);const hit=(m.occupations||[]).find(o=>String(o.soc||'').replace(/\D/g,'').slice(0,6)===digits);return occShape(hit)||c}catch{return c}}
function sanitizedJourney(){const j=journey(),p=portal();return{region:'Northern Arizona',participant:j.participant||{},progress:j.progress||{},portal:{pathway:localStorage.getItem(PATH)||'',map:p,career:{financialMarked:!!p?.career?.financial,aiMarked:!!p?.career?.ai},rapid:{skillMobilityMarked:!!p?.rapid?.skillmobility,jobSearchMarked:!!p?.rapid?.jobsearch,financialMarked:!!p?.rapid?.financial,aiMarked:!!p?.rapid?.ai},completionSource:'Northern BOOST validated journey and map state.'},modules:{module1:j.module1||j.modules?.module1||{},module2:j.module2||j.modules?.module2||{},module3:j.module3||j.modules?.module3||{},module4:j.module4||j.modules?.module4||{},module5:j.module5||j.modules?.module5||{}}}}
async function northernAsk(question,targetId,btn){const w=frame.contentWindow,d=frame.contentDocument,out=d.getElementById(targetId);if(!out)return;out.classList.add('show');out.textContent='Rosie is looking at your Northern BOOST context…';if(btn)btn.disabled=true;try{const c=getClient(),session=(await c.auth.getSession()).data.session;if(!session)throw new Error('Sign in to Northern BOOST to use Rosie here.');const focus=await focusOccupation(),items=focus?[focus]:[];const r=await c.functions.invoke(ENDPOINT,{body:{question,journey:sanitizedJourney(),page:'Northern BOOST — AI & You',occupations:items,focusOccupation:focus,history:[]}});if(r.error)throw r.error;out.textContent=r.data?.answer||'Rosie could not complete that response.'}catch(e){out.textContent='Rosie is unavailable in this view right now. '+String(e?.message||e)}finally{if(btn)btn.disabled=false}}
async function northernSave(snapshot,badges){const w=frame.contentWindow,d=frame.contentDocument,j=journey(),c=career(),reflection=d.getElementById('reflection')?.value?.trim()||'',sector=w.st?.sector||null,scenario=sector&&w.S?.[sector]?w.S[sector].label:'';const now=new Date().toISOString(),evidence={version:'ai-you-v2-northern-20260916',completedAt:now,completed_at:now,career_context:c,scenario:{id:sector,label:scenario,recommended:scenarioFor(c)===sector},clear_prompt:{elements_present:snapshot.clearElements,status:snapshot.statuses['Directing AI']},judgment:{sample_response:w.st?.sampleJudgment,challenge_direct:w.st?.challenge?.[1],challenge_check:w.st?.challenge?.[2],challenge_privacy:w.st?.challenge?.[3]},snapshot:snapshot.statuses,reflection,badges};j.region='Northern Arizona';j.modules=j.modules||{};j.modules.module5=evidence;j.module5=evidence;j.updatedAt=now;j.updated_at=now;localStorage.setItem(JK,JSON.stringify(j));let saved=false;try{const cl=getClient(),session=(await cl.auth.getSession()).data.session;if(session?.user){const r=await cl.rpc('boost_save_my_journey_for_region',{p_region:'Northern Arizona',p_journey:j});saved=!r.error}else{const id=localStorage.getItem('boost_naz_cloud_journey_id'),token=localStorage.getItem('boost_naz_cloud_access_token');if(id&&token){const r=await cl.rpc('boost_save_journey',{p_journey_id:id,p_access_token:token,p_journey:j});saved=!r.error}}}catch(e){console.warn('Northern AI & You cloud save unavailable',e)}const status=d.getElementById('saveStatus');if(status)status.textContent=saved?'Saved to your Northern BOOST journey.':'Saved on this device. Northern BOOST will sync it when your cloud connection is available.'}
function applyNorthernContext(){const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return false;w.readJourney=journey;w.getCareer=career;w.askRosie=northernAsk;w.saveJourney=northernSave;const c=career();d.querySelectorAll('.sector.recommended').forEach(el=>el.classList.remove('recommended'));const careerLine=d.getElementById('careerLine'),intro=d.getElementById('rosieIntroText'),ask=d.getElementById('askCareerBtn');if(ask)ask.style.display='';if(c){if(careerLine)careerLine.innerHTML='Your current Northern BOOST direction: <span class="careerChip">'+escapeHtml(c.title)+(c.route?' • '+escapeHtml(c.route):'')+'</span>';if(intro)intro.textContent='You have already built Northern BOOST career evidence around '+c.title+'. AI & You will practice a transferable workplace skill in that context: directing AI, checking its work, protecting information, and deciding what should actually be used.';const rec=scenarioFor(c),b=rec?d.querySelector('[data-sector="'+rec+'"]'):null;if(b)b.classList.add('recommended')}else{if(careerLine)careerLine.textContent='I’ll connect this activity to what you have already learned in Northern BOOST.';if(intro)intro.textContent='AI literacy is useful across careers because the skill is not letting AI decide. The skill is knowing how to direct it, check it, and decide what is safe and useful.'}return true}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function buildFrameUrl(){const u=new URL(URL_BASE);const q=new URLSearchParams(location.search);q.forEach((v,k)=>u.searchParams.set(k,v));u.searchParams.set('boost_region','northern');return u.toString()}
frame.addEventListener('load',()=>{try{applyNorthernContext();loading.classList.add('hidden')}catch(e){console.error(e);loading.querySelector('span').textContent='AI & You loaded, but the Northern BOOST adapter could not finish connecting. Refresh the page to try again.'}});
frame.src=buildFrameUrl();
})();
</script>
</body>
</html>
