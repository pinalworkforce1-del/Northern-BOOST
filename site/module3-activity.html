.lab-modal{position:fixed;inset:0;z-index:2147483000;background:#061522e8;display:none;flex-direction:column;padding:12px}.lab-modal.open{display:flex}.lab-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 14px;background:var(--navy);color:#fff;border-radius:12px 12px 0 0;border-bottom:3px solid var(--gold)}.lab-bar b{font-size:15px}.lab-close{border:1px solid #ffffff60;border-radius:999px;background:#ffffff12;color:#fff;padding:8px 12px;font-weight:900;cursor:pointer}.lab-frame{border:0;width:100%;height:calc(100vh - 72px);background:#fff;border-radius:0 0 12px 12px}

<div class="lab-modal" id="labModal" role="dialog" aria-modal="true" aria-label="BOOST Pizza Workplace Skills Lab"><div class="lab-bar"><b>BOOST Workplace Skills Lab • Optional Module 3 Evidence</b><button class="lab-close" id="labClose">Close Lab</button></div><iframe class="lab-frame" id="labFrame" title="BOOST Pizza Workplace Skills Lab"></iframe></div>
<div class="toast" id="toast"></div>
<script>
(()=>{
'use strict';
const KEY='boost_naz_journey_v1', PREFIX='BOOST_NAZ_JOURNEY_V1:';
const LAB_URL='https://pinalworkforce1-del.github.io/BOOST-Job_Mobility/?boost_embed=module3';
const LAB_MESSAGE='BOOST_NAZ_M3_SKILL_LAB_RESULT';
const frame=document.getElementById('activityFrame'), modal=document.getElementById('labModal'), labFrame=document.getElementById('labFrame');
let labCache=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function readJourney(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(_){return{}}}
function writeJourney(j){j.region='Northern Arizona';j.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(j));try{window.name=PREFIX+JSON.stringify(j)}catch(_){}return j}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function topCodes(){const j=readJourney(),m1=j.module1||{};let a=(m1.topInterests||[]).map(x=>typeof x==='string'?x:x?.code).filter(x=>/^[RIASEC]$/.test(x));if(a.length>=3)return a.slice(0,3);const scores=m1.interestScores||m1.scores||{};return Object.entries(scores).sort((a,b)=>Number(b[1])-Number(a[1])).map(([k])=>k).filter(x=>/^[RIASEC]$/.test(x)).slice(0,3)}
function labPanelMarkup(lab){const prefs=(lab?.workPreferences||[]).slice(0,4);return `<div class="boostNazLabGrid"><div><div class="step">Optional Evidence Check • Workplace Skills Lab</div><h2>Not sure which strengths you want to use more?</h2><p>Your self-assessment tells BOOST how often you have used these skills. The Pizza Workplace Lab gives you a different kind of evidence: how you respond to realistic situations and whether you actually <b>want more work that feels like that</b>.</p><div class="boostNazLabCall"><b>This is not a test of occupational competence.</b><br>The lab adds evidence about workplace judgment and preference. It helps you notice patterns—it does not decide what career you should choose.</div><div class="boostNazLabActions"><button class="boostNazLabBtn" id="boostNazOpenLab" type="button">TRY THE WORKPLACE SKILLS LAB →</button><button class="boostNazLabBtn alt" id="boostNazSkipLab" type="button">SKIP FOR NOW</button></div><div class="boostNazLabSummary" id="boostNazLabSummary" ${lab?'':'style="display:none"'}>${lab?'<b>Workplace Lab evidence added to Module 3 ✓</b><br>Your strongest preference signals are now part of your Northern BOOST mobility evidence.'+(prefs.length?'<div class="boostNazPills">'+prefs.map(x=>`<span>${esc(x.name)} • ${esc(x.preferenceLabel)}</span>`).join('')+'</div>':''):''}</div></div><div class="boostNazLabFacts"><div><span>Input</span><b>Your O*NET interests</b></div><div><span>Evidence</span><b>Workplace choices</b></div><div><span>Reflection</span><b>Want more / maybe / less</b></div><div><span>Output</span><b>Preferences + skill signals</b></div></div></div>`}
function injectLabPanel(){try{const d=frame.contentDocument;if(!d?.body||d.getElementById('boostNazM3Lab'))return;const style=d.createElement('style');style.id='boostNazM3LabCSS';style.textContent=`#boostNazM3Lab{border:2px solid #d7c16c!important;background:linear-gradient(135deg,#fffaf0,#fff)!important}.boostNazLabGrid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px;align-items:center}.boostNazLabGrid h2{margin:.25rem 0}.boostNazLabGrid p{line-height:1.55;color:#425b70}.boostNazLabCall{padding:13px;border-radius:12px;background:#fff7db;border-left:5px solid #d9a73c}.boostNazLabActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.boostNazLabBtn{border:0;border-radius:10px;padding:12px 15px;background:#0b3158;color:#fff;font-weight:900;cursor:pointer}.boostNazLabBtn.alt{background:#eaf0f5;color:#17324d}.boostNazLabSummary{margin-top:13px;padding:13px;border-radius:12px;background:#eef8f6;border:1px solid #c9e6df}.boostNazLabSummary b{color:#176e69}.boostNazPills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.boostNazPills span{padding:5px 8px;border-radius:999px;background:#fff;border:1px solid #cbdbe3;font-size:.75rem;font-weight:800;color:#315166}.boostNazLabFacts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.boostNazLabFacts div{padding:10px;border:1px solid #e0e7ec;background:#fff;border-radius:10px}.boostNazLabFacts span{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:#708397;font-weight:900}.boostNazLabFacts b{display:block;margin-top:3px;color:#17324d;font-size:.85rem}@media(max-width:800px){.boostNazLabGrid,.boostNazLabFacts{grid-template-columns:1fr}}`;d.head.appendChild(style);const panel=d.createElement('section');panel.id='boostNazM3Lab';panel.className='panel';const j=readJourney();labCache=j?.module3?.skillLab||null;panel.innerHTML=labPanelMarkup(labCache);const anchor=d.getElementById('resultsPanel')||d.getElementById('reportPanel')||[...d.querySelectorAll('section.panel')].find(x=>/Career Mobility/i.test(x.textContent));if(anchor?.parentNode)anchor.parentNode.insertBefore(panel,anchor);else d.body.appendChild(panel);d.getElementById('boostNazOpenLab')?.addEventListener('click',openLab);d.getElementById('boostNazSkipLab')?.addEventListener('click',()=>anchor?.scrollIntoView({behavior:'smooth',block:'start'}));}catch(e){console.warn('Northern Module 3 Pizza Lab panel injection failed',e)}}
function refreshLabSummary(){try{const d=frame.contentDocument,box=d?.getElementById('boostNazLabSummary');if(!box||!labCache)return;const prefs=(labCache.workPreferences||[]).slice(0,4);box.style.display='block';box.innerHTML='<b>Workplace Lab evidence added to Module 3 ✓</b><br>Your strongest preference signals are now part of your Northern BOOST mobility evidence.'+(prefs.length?'<div class="boostNazPills">'+prefs.map(x=>`<span>${esc(x.name)} • ${esc(x.preferenceLabel)}</span>`).join('')+'</div>':'')}catch(e){}
}
function openLab(){modal.classList.add('open');if(!labFrame.src){labFrame.src=LAB_URL}else{prepareLab()}}
document.getElementById('labClose').addEventListener('click',()=>modal.classList.remove('open'));
labFrame.addEventListener('load',()=>setTimeout(prepareLab,150));
function prepareLab(){try{const d=labFrame.contentDocument;if(!d?.body)return;const codes=topCodes();['top1','top2','top3'].forEach((id,i)=>{const el=d.getElementById(id);if(el&&codes[i]){el.value=codes[i];el.dispatchEvent(new Event('change',{bubbles:true}))}});if(!d.getElementById('boostNazLabCarry')){const n=d.createElement('div');n.id='boostNazLabCarry';n.style.cssText='padding:10px 14px;background:#e8f4f2;color:#123b48;border-bottom:3px solid #d9a73c;font:800 13px/1.45 Arial,sans-serif';n.innerHTML='<b>Carried from Northern BOOST Discover:</b> '+(codes.length?codes.join(' • '):'Your interest pattern remains part of this activity.')+'<br><span style="font-weight:500">This optional lab adds workplace preference evidence to Module 3. It does not change Northern Arizona Regional Opportunity or recommendation rules.</span>';d.body.insertBefore(n,d.body.firstChild)}if(!d.getElementById('boostNazLabBridge')){const s=d.createElement('script');s.id='boostNazLabBridge';s.textContent=`(function(){let sent=false;function snap(){try{const skills=SKILLS.filter(s=>skillEvidence[s]&&skillEvidence[s].count).map(s=>{const e=skillEvidence[s],p=skillPreference[s]||{sum:0,count:0};const ev=e.count?e.sum/e.count:0,pref=p.count?p.sum/p.count:0;return{name:s,evidenceScore:Number(ev.toFixed(2)),evidenceLabel:capFor(s),preferenceScore:Number(pref.toFixed(2)),preferenceLabel:pref>=1.25?'Want more of this':pref>=.6?'Still exploring':'Lower preference'}}).sort((a,b)=>b.preferenceScore-a.preferenceScore||b.evidenceScore-a.evidenceScore);const fam=F.map(code=>{const p=familyPreference[code]||{sum:0,count:0},avg=p.count?p.sum/p.count:0;return{code,label:LABELS[code],preferenceScore:Number(avg.toFixed(2)),preferenceLabel:avg>=1.5?'Generally liked':avg>=.75?'Mixed / more exposure':'Generally preferred less'}});window.parent.postMessage({type:'${LAB_MESSAGE}',payload:{source:'pizza_workplace_lab',completedAt:new Date().toISOString(),scenarioCount:route.length,topInterests:[document.getElementById('top1')?.value,document.getElementById('top2')?.value,document.getElementById('top3')?.value].filter(Boolean),strengthsToCarry:skills.filter(x=>x.evidenceScore>=2).slice(0,5),workPreferences:skills.slice(0,5),familyPreferences:fam}},location.origin);sent=true}catch(e){console.warn(e)}}const st=document.getElementById('resultsStage');if(st){new MutationObserver(()=>{if(st.classList.contains('active')&&!sent)setTimeout(snap,60)}).observe(st,{attributes:true,attributeFilter:['class']});if(st.classList.contains('active'))snap()}})();`;d.body.appendChild(s)}}catch(e){console.warn('Pizza Lab preparation unavailable',e)}}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!==LAB_MESSAGE||!e.data.payload)return;labCache=e.data.payload;const j=readJourney();j.module3=j.module3||{};Object.assign(j.module3,{skillLab:labCache,workPreferences:labCache.workPreferences||[],skillEvidence:labCache.strengthsToCarry||[],skillLabUpdatedAt:new Date().toISOString()});writeJourney(j);modal.classList.remove('open');refreshLabSummary();toast('Pizza Lab evidence added to Module 3 ✓')});
function patchPersistence(){try{const w=frame.contentWindow;if(!w||w.__boostNazPizzaPersistPatched)return;const orig=w.persistModule3;if(typeof orig!=='function')return;w.__boostNazPizzaPersistPatched=true;w.persistModule3=function(status){const r=orig.call(w,status);const cache=labCache||readJourney()?.module3?.skillLab;if(cache){try{w.JOURNEY=w.JOURNEY||readJourney();w.JOURNEY.module3=w.JOURNEY.module3||{};Object.assign(w.JOURNEY.module3,{skillLab:cache,workPreferences:cache.workPreferences||[],skillEvidence:cache.strengthsToCarry||[],skillLabUpdatedAt:new Date().toISOString()});if(typeof w.writeJourney==='function')w.writeJourney(w.JOURNEY);else writeJourney(w.JOURNEY)}catch(e){console.warn('Lab merge after Module 3 save failed',e)}}return r};}catch(e){console.warn('Module 3 persistence patch unavailable',e)}}
frame.addEventListener('load',()=>setTimeout(()=>{injectLabPanel();patchPersistence()},350));
document.getElementById('finishBtn').addEventListener('click',async()=>{const b=document.getElementById('finishBtn');try{const w=frame.contentWindow;if(typeof w.persistModule3==='function')w.persistModule3('complete');const j=readJourney();if(labCache){j.module3=j.module3||{};Object.assign(j.module3,{skillLab:labCache,workPreferences:labCache.workPreferences||[],skillEvidence:labCache.strengthsToCarry||[]});writeJourney(j)}b.disabled=true;b.textContent='✓ Saved — returning to BOOST…';await new Promise(r=>setTimeout(r,650));location.assign('index.html#step=module3')}catch(e){console.warn(e);b.disabled=false;toast('Complete the Module 3 activity before returning to the map.')}});
})();
</script>
