<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Northern Arizona mountain high country with evergreen pines, snow-capped peaks and golden sunrise">
<defs>
 <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fffaf0"/><stop offset=".64" stop-color="#fff6e7"/><stop offset="1" stop-color="#f6e6c8"/>
 </linearGradient>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#f9ebd0"/><stop offset=".55" stop-color="#f6e3c4"/><stop offset=".9" stop-color="#f4cea0"/><stop offset="1" stop-color="#e6b27d"/>
 </linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#d3a252"/><stop offset=".32" stop-color="#ffe5a1"/><stop offset=".7" stop-color="#bd8640"/><stop offset="1" stop-color="#f9d889"/>
 </linearGradient>
 <radialGradient id="sun" cx=".62" cy=".64" r=".58"><stop stop-color="#fff9df" stop-opacity=".95"/><stop offset="1" stop-color="#fff0ca" stop-opacity="0"/></radialGradient>
 <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#527b95"/><stop offset="1" stop-color="#2c5870"/></linearGradient>
 <linearGradient id="foreground" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#315864"/><stop offset="1" stop-color="#173f4d"/></linearGradient>
 <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fff9ec" stop-opacity=".85"/><stop offset=".48" stop-color="#fff9ec" stop-opacity=".75"/><stop offset=".65" stop-color="#fff9ec" stop-opacity=".45"/><stop offset=".80" stop-color="#fff9ec" stop-opacity=".05"/><stop offset="1" stop-color="#fff9ec" stop-opacity="0"/>
 </linearGradient>
 <pattern id="fleck" width="92" height="80" patternUnits="userSpaceOnUse"><path d="M9 22l7-2M70 38l4 2M33 71l4-1" stroke="#a99370" stroke-width="1.4" opacity=".10"/></pattern>
 <g id="pine">
  <path d="M0 0V148" stroke="#273a33" stroke-width="8"/>
  <path d="M0-27l-19 39h10L-33 53h12l-24 45h18l-19 39h92L27 98h18L21 53h12L9 12h10Z" fill="#183f3a"/>
  <path d="M0-27L-19 12h10L-33 53h12l-24 45h18l-19 39H0Z" fill="#39735d" opacity=".72"/>
 </g>
 <clipPath id="inside"><rect x="34" y="34" width="1532" height="832" rx="16"/></clipPath>
</defs>
<rect width="1600" height="900" fill="#102f49"/>
<rect x="19" y="19" width="1562" height="862" rx="23" fill="url(#gold)"/>
<rect x="30" y="30" width="1540" height="840" rx="16" fill="url(#sky)"/>
<g clip-path="url(#inside)">
 <rect x="30" y="30" width="1540" height="840" fill="url(#parchment)"/>
 <rect x="31" y="435" width="1538" height="432" fill="url(#sky)"/>
 <ellipse cx="970" cy="565" rx="500" ry="270" fill="url(#sun)"/>
 <!-- Distant Northern Arizona peaks; pale snow and cool blue rocky ridges -->
 <path d="M30 737 137 673 210 705 352 625 421 655 548 604 655 677 805 574 903 659 1059 539 1193 647 1318 571 1450 651 1570 596V872H30Z" fill="#b5c2c4"/>
 <path d="M30 778 156 685 287 730 443 608 575 716 707 618 828 724 973 577 1119 705 1285 595 1412 699 1570 628V872H30Z" fill="#87a4ad"/>
 <path d="M680 694 970 503 1268 718 1169 670 1105 584 1068 601 1028 555 981 564 942 546 880 630Z" fill="#426981"/>
 <path d="M856 579 970 503 1083 582 1034 561 998 540 974 549 956 535 932 550Z" fill="#f6f6ed"/>
 <path d="M1022 622 1285 542 1470 682 1370 646 1330 593 1306 610 1287 585 1240 603 1191 580Z" fill="#527991"/>
 <path d="M1204 568 1285 542 1362 596 1329 583 1305 569 1281 580 1260 567Z" fill="#f7f6ec"/>
 <path d="M30 794C230 728 331 783 517 718S909 705 1071 757s350-42 499-15V871H30Z" fill="url(#ridge)"/>
 <path d="M30 829C251 748 436 792 616 747S1004 731 1197 782s248-5 373-5V870H30Z" fill="url(#foreground)"/>
 <!-- Pine forests: visible along lower landscape and side borders -->
 <g opacity=".94">
  <use href="#pine" transform="translate(78 673) scale(1.18)"/>
  <use href="#pine" transform="translate(175 758) scale(.80)"/>
  <use href="#pine" transform="translate(275 778) scale(.69)"/>
  <use href="#pine" transform="translate(387 797) scale(.65)"/>
  <use href="#pine" transform="translate(514 821) scale(.51)"/>
  <use href="#pine" transform="translate(1152 810) scale(.60)"/>
  <use href="#pine" transform="translate(1280 769) scale(.87)"/>
  <use href="#pine" transform="translate(1390 730) scale(.92)"/>
  <use href="#pine" transform="translate(1502 680) scale(1.17)"/>
  <use href="#pine" transform="translate(1575 748) scale(.82)"/>
 </g>
 <path d="M30 848C175 815 264 847 408 826c183-26 299 34 494 2 234-37 417 32 668-8V870H30Z" fill="#163b47" opacity=".62"/>
 <!-- Parchment transparency keeps the center of the certificate highly readable -->
 <rect x="31" y="30" width="1538" height="838" fill="url(#veil)"/>
 <rect x="32" y="31" width="1536" height="838" fill="url(#fleck)"/>
</g>
<!-- Northern-inspired award frame -->
<rect x="42" y="42" width="1516" height="816" rx="8" fill="none" stroke="#ffeabd" stroke-width="5"/>
<rect x="54" y="54" width="1492" height="792" rx="4" fill="none" stroke="#ac7d3e" stroke-width="2.5"/>
<path d="M54 130V54h76M1470 54h76v76M54 770v76h76M1470 846h76v-76" fill="none" stroke="#143b56" stroke-width="9" stroke-linejoin="miter"/>
<path d="M146 54h370M1084 54h370" stroke="#d3a251" stroke-width="3" opacity=".85"/>
<path d="M146 846h310M1144 846h310" stroke="#d3a251" stroke-width="3" opacity=".85"/>
</svg>