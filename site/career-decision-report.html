<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northern BOOST Career Decision Report</title>
<style>
:root{--navy:#102b46;--blue:#246a8d;--green:#176f66;--gold:#dca733;--purple:#7554a8;--ink:#183244;--muted:#60717d;--line:#d7e2e9;--paper:#fff;--bg:#eaf0f4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;line-height:1.5}.toolbar{position:sticky;top:0;z-index:20;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;background:#081e31;color:#fff}.toolbar a,.toolbar button{border:1px solid #ffffff35;background:#ffffff10;color:#fff;border-radius:999px;padding:9px 13px;font-weight:850;text-decoration:none;cursor:pointer}.toolbar button.active{background:#fff;color:#12324a}.toolbar .print{margin-left:auto;background:#dca733;color:#302300;border-color:#f1ce6f}.page{width:min(960px,calc(100% - 28px));margin:22px auto;background:var(--paper);box-shadow:0 12px 34px #19364a20;border-radius:18px;overflow:hidden}.reportHeader{padding:28px 34px;background:linear-gradient(135deg,#0e3049,#1f638b);color:#fff;border-bottom:6px solid var(--gold)}.kicker{text-transform:uppercase;letter-spacing:.1em;font-size:.74rem;font-weight:900;color:#ffdf88}.reportHeader h1{margin:.25rem 0 .35rem;font-size:clamp(2rem,5vw,3.25rem)}.reportHeader p{margin:0;color:#eaf5fb}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 34px;background:#f5f8fa;border-bottom:1px solid var(--line)}.meta div{font-size:.88rem}.meta small,.label{display:block;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-size:.7rem;font-weight:900}.content{padding:24px 34px 36px}.intro{padding:15px 17px;background:#f2f8fb;border-left:5px solid var(--blue);border-radius:12px;margin-bottom:20px}.section{margin:24px 0}.section h2{margin:0 0 10px;color:var(--navy);font-size:1.25rem}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff}.card b{display:block;margin-top:3px}.route{padding:18px;border-radius:14px;color:#fff}.route.READY{background:linear-gradient(135deg,#176f66,#2a9d8f)}.route.BRIDGE{background:linear-gradient(135deg,#246a8d,#438fc0)}.route.BUILD{background:linear-gradient(135deg,#664393,#896bc0)}.route.RECONSIDER{background:linear-gradient(135deg,#87563f,#aa765d)}.route .routeName{font-size:1.7rem;font-weight:1000}.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{border:1px solid #cbd8e0;background:#f7fafb;border-radius:999px;padding:6px 9px;font-size:.82rem;font-weight:750}.path{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}.step{flex:1 1 180px;padding:13px;border-radius:12px;background:#f2f8fb;border:1px solid #cce0ea}.arrow{align-self:center;font-weight:1000;color:#4b7088}.twoCol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.support{border-left:5px solid var(--green);background:#f0faf5}.attention{border-left:5px solid var(--gold);background:#fff8e8}.support,.attention{padding:14px 16px;border-radius:12px}.support ul,.attention ul,.coachList{margin:.4rem 0 .1rem;padding-left:1.2rem}.footerNote{margin-top:26px;padding:15px;border-radius:12px;background:#f6f2fb;border-left:5px solid var(--purple)}.coachOnly{display:none}.coachMode .participantOnly{display:none}.coachMode .coachOnly{display:block}.coachBox{padding:14px;border:1px solid var(--line);border-radius:12px;margin:10px 0}.empty{padding:28px 34px}.empty a{color:#174f77;font-weight:800}@media(max-width:700px){.meta,.grid,.twoCol{grid-template-columns:1fr}.reportHeader,.content,.meta{padding-left:18px;padding-right:18px}.arrow{display:none}.toolbar .print{margin-left:0}}
@media print{body{background:#fff}.toolbar{display:none!important}.page{width:100%;margin:0;box-shadow:none;border-radius:0}.reportHeader{-webkit-print-color-adjust:exact;print-color-adjust:exact}.route,.intro,.support,.attention,.footerNote,.step{-webkit-print-color-adjust:exact;print-color-adjust:exact}.participantOnly,.coachOnly{break-inside:avoid}.section{break-inside:avoid}.coachMode .participantOnly{display:none!important}.coachMode .coachOnly{display:block!important}}
</style>
</head>
<body>
<div class="toolbar"><a href="Northern_BOOST_Module4_Connected_Test_v0.6.html">← Module 4</a><button id="participantBtn" class="active">Participant Report</button><button id="coachBtn">Career Coach Summary</button><button id="printBtn" class="print">Print / Save as PDF</button></div>
<div id="app" class="page"></div>
<script>
'use strict';
const JKEY='boost_naz_journey_v1',SKEY='northern_boost_career_exploration_v1';
const read=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(_){return{}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>Number.isFinite(Number(v))?Math.round(Number(v)).toLocaleString():'—';
const money=v=>Number.isFinite(Number(v))?'$'+Number(v).toFixed(2):'—';
const J=read(JKEY),S=read(SKEY),M1=S.module1||J.module1||{},M2=S.module2||J.module2||{},M3=S.module3||J.module3||{},M4=S.module4||J.module4||{};
const NAMES={R:'Realistic',I:'Investigative',A:'Artistic',S:'Social',E:'Enterprising',C:'Conventional'};
const ROUTE_NAMES={READY:'WORK NOW',BRIDGE:'EARN WHILE YOU LEARN',BUILD:'TRAINING INVESTMENT CONVERSATION',RECONSIDER:'EXPLORE BEFORE COMMITTING'};
const target=M4.careerTarget||{},SOC=String(target.soc||'');
const findCareer=()=>[...(M3.careers||[]),...(M2.careers||[]),...(M1.selected||[]),...(M1.careers||[])].find(x=>String(x?.soc||'')===SOC)||{};
const C=findCareer(),V=M2.validationBySoc?.[SOC]||{},SIG=M3.mobilitySignalsBySoc?.[SOC]||M3.decisionEvidence?.mobilitySignalsBySoc?.[SOC]||{};
const B=M4.boostSignal||{};
function participantName(){const p=S.participant||J.participant||{};return p.fullName||p.name||[p.firstName,p.lastName].filter(Boolean).join(' ')||p.first_name||'BOOST Participant'}
function themes(){let t=M3.decisionEvidence?.onet?.topInterests||M1.topInterests||J.module1?.topInterests||[];return t.slice(0,3).map(x=>typeof x==='string'?(NAMES[x]||x):(x.label||NAMES[x.code]||x.code)).filter(Boolean)}
function strengths(){const rows=M3.selfAssessment||M3.decisionEvidence?.selfAssessment||[];const a=rows.filter(x=>/Used Regularly|Used Sometimes/i.test(String(x?.use||''))).map(x=>x.skill||x.name||x.activity).filter(Boolean);const lab=M3.decisionEvidence?.workplaceLab||M3.skillLab||null;const b=(lab?.strengthsToCarry||M3.skillEvidence||[]).map(x=>typeof x==='string'?x:(x.strength||x.skill||x.name||x.label)).filter(Boolean);return [...new Set([...a,...b])].slice(0,8)}
function prefs(){const lab=M3.decisionEvidence?.workplaceLab||M3.skillLab||null;return (lab?.workPreferences||M3.workPreferences||[]).map(x=>typeof x==='string'?x:(x.preference||x.label||x.prompt||x.name)).filter(Boolean).slice(0,6)}
function pathway(){return SIG.forwardPathway||M3.decisionEvidence?.mobilitySignalsBySoc?.[SOC]?.forwardPathway||null}
function pathSteps(){const p=pathway();if(!p)return[];return [{label:'START HERE',value:target.title||C.title||SOC},...(p.bridge||[]).map(x=>({label:'NEXT MOVE',value:x})),...(p.dest||[]).map(x=>({label:'LONGER-TERM OPTION',value:x}))]}
function regional(){const jobs=B.jobs??C.jobs,open=B.annualOpenings??C.annualOpenings,growth=B.growthPercent??C.growthPercent;return [jobs!=null?`${num(jobs)} regional jobs`:'',open!=null?`${num(open)} annual openings`:'',growth!=null?`${Number(growth)>0?'+':''}${Number(growth).toFixed(1)}% projected growth`:'' ].filter(Boolean).join(' • ')||B.regionalOpportunityLabel||C.regionalOpportunityLabel||'Northern Arizona evidence carried from BOOST'}
function wage(){const a=[];if(B.wage25!=null||C.wage25!=null)a.push(`Entry estimate ${money(B.wage25??C.wage25)}/hr`);if(B.wageMedian!=null||C.wageMedian!=null)a.push(`Median ${money(B.wageMedian??C.wageMedian)}/hr`);if(B.wagesInterpretation||V.wages)a.push(B.wagesInterpretation||V.wages);return a.join(' • ')||'Wage evidence not recorded'}
function prep(){return {readiness:B.preparationReadiness||V.prep||C.preparationReadiness||'Not recorded',education:B.typicalEntryEducation||C.typicalEntryEducation||C.preparationIntel?.education||'Varies by occupation',experience:B.workExperienceRequired||C.workExperienceRequired||'Varies by occupation',ojt:B.typicalOnTheJobTraining||C.typicalOnTheJobTraining||'Varies by occupation'}}
function route(){return M4.participantDirection||B.route||'RECONSIDER'}
function routeWhy(){const r=route();const map={READY:'The combined evidence supports competing for this role now. Continue using your Career Coach and employer research to target the strongest opportunities.',BRIDGE:'A preparation gap remains, but BOOST has evidence of an employer-supported or earn-while-you-learn route that may help close it.',BUILD:'The career remains worth considering, but an occupation-specific preparation, credential, or license gap should be addressed before treating it as ready-now work.',RECONSIDER:'Some part of the wage, life fit, preparation, confidence, or current evidence suggests more exploration would be useful before committing.'};return map[r]||map.RECONSIDER}
function supports(){const x=[];const rl=B.regionalOpportunityLabel||C.regionalOpportunityLabel;if(rl&&!/limited|very limited/i.test(rl))x.push(`${rl} in Northern Arizona`);if(B.interestConnection&&!/different/i.test(B.interestConnection))x.push(B.interestConnection);if(SIG.lane==='WORK NOW')x.push('Career Mobility identified a realistic near-term employment signal');else if(SIG.lane==='MOVE NOW')x.push('Career Mobility found meaningful transferable experience');if(V.wages&&!/no|does not|not work/i.test(V.wages))x.push(`Wage fit: ${V.wages}`);if(V.life&&!/no|does not/i.test(V.life))x.push(`Life fit: ${V.life}`);strengths().slice(0,3).forEach(s=>x.push(`Transferable strength: ${s}`));return [...new Set(x)].slice(0,6)}
function attention(){const x=[];const p=prep();if(route()==='BUILD')x.push(`Preparation needs attention: ${p.readiness}`);if(route()==='BRIDGE')x.push('Confirm the exact employer-supported route, eligibility, timing, and commitments');if(!M4.employerBridgeEvidence&&route()!=='READY')x.push('No verified employer-supported/WBL route is currently attached to this decision');if(V.wages&&/maybe|tight|no|higher/i.test(V.wages))x.push(`Wage consideration: ${V.wages}`);if(V.life&&/maybe|no|adjust/i.test(V.life))x.push(`Life-fit consideration: ${V.life}`);if(V.future&&/no|reconsider|uncertain/i.test(V.future))x.push(`Future-direction consideration: ${V.future}`);if(!x.length)x.push('Continue validating employer-specific requirements, schedule, commute, and advancement expectations before acting');return [...new Set(x)].slice(0,6)}
function coachPrompts(){const r=route(),p=prep(),x=[];if(r==='READY'){x.push('Which employers and openings should we target first?','What résumé evidence best demonstrates the transferable strengths identified in BOOST?','What wage and schedule boundaries should guide the job search?')}else if(r==='BRIDGE'){x.push('What verified employer-supported route is available, and what are its exact entry requirements?','Can OJT, apprenticeship, employer-paid credentialing, or another earn-while-you-learn option close the identified gap?','What is the backup plan if the employer-supported route does not materialize?')}else if(r==='BUILD'){x.push(`What is the smallest credible preparation investment needed for entry (${p.education})?`,'What approved training options, costs, duration, and funding rules should we compare?','Does the likely wage gain justify the training investment and time away from work?','Is there a lower-barrier related occupation that could be pursued first while building toward this target?')}else{x.push('Which part of the evidence is creating the most hesitation—wage, life fit, preparation, or confidence?','Should we revisit a paused career or intentionally explore a different occupation?','What additional employer or networking research would make the decision clearer?')}return x}
function pills(items){return items.length?`<div class="pills">${items.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>`:'<span class="muted">No additional evidence recorded.</span>'}
function list(items){return `<ul>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}
function render(){const app=document.getElementById('app');if(!SOC||!M4.completedAt){app.innerHTML=`<div class="empty"><h2>Your Career Decision Report is not ready yet.</h2><p>Complete Module 4 and save your decision first.</p><a href="Northern_BOOST_Module4_Connected_Test_v0.6.html">Return to Module 4 →</a></div>`;return}const p=prep(),ps=pathSteps(),r=route(),name=participantName(),date=new Date(M4.completedAt||Date.now()).toLocaleDateString();
app.innerHTML=`<header class="reportHeader"><div class="kicker">Northern Arizona BOOST</div><h1>Career Decision Report</h1><p>A personalized summary of the evidence you gathered through Discover, Reality Check, Career Mobility, and Decide.</p></header><div class="meta"><div><small>Participant</small><b>${esc(name)}</b></div><div><small>Career</small><b>${esc(target.title||C.title||SOC)}</b></div><div><small>Decision date</small><b>${esc(date)}</b></div></div><div class="content">
<section class="participantOnly"><div class="intro">This report brings together your interests, labor-market research, transferable experience, preparation evidence, life considerations, and career-pathway information. It is designed to support a thoughtful decision and a focused conversation with your Career Coach—not to make the decision for you.</div>
<div class="route ${esc(r)}"><span class="label" style="color:#fff9">CURRENT BOOST DIRECTION</span><div class="routeName">${esc(ROUTE_NAMES[r]||r)}</div><div>${esc(routeWhy())}</div></div>
<div class="section"><h2>What you learned about yourself</h2><div class="grid"><div class="card"><span class="label">Strongest interest themes</span><b>${esc(themes().join(' • ')||'Interest evidence carried from Discover')}</b></div><div class="card"><span class="label">Career Mobility signal</span><b>${esc(SIG.lane||B.mobilityPath||'Mobility reviewed')}</b><span>${esc(SIG.reason||B.mobilityReason||'')}</span></div></div><div style="margin-top:10px"><span class="label">Transferable strengths</span>${pills(strengths())}</div>${prefs().length?`<div style="margin-top:10px"><span class="label">Work preferences from the optional Workplace Skills Lab</span>${pills(prefs())}</div>`:''}</div>
<div class="section"><h2>Northern Arizona labor-market evidence</h2><div class="grid"><div class="card"><span class="label">Regional opportunity</span><b>${esc(B.regionalOpportunityLabel||C.regionalOpportunityLabel||'Northern Arizona regional evidence')}</b><span>${esc(regional())}</span></div><div class="card"><span class="label">Wage evidence</span><b>${esc(wage())}</b></div></div></div>
<div class="section"><h2>Reality Check</h2><div class="grid"><div class="card"><span class="label">Preparation readiness</span><b>${esc(p.readiness)}</b></div><div class="card"><span class="label">Typical entry education</span><b>${esc(p.education)}</b></div><div class="card"><span class="label">Related experience</span><b>${esc(p.experience)}</b></div><div class="card"><span class="label">Typical on-the-job training</span><b>${esc(p.ojt)}</b></div><div class="card"><span class="label">Life fit</span><b>${esc(B.lifeInterpretation||V.life||'Not recorded')}</b></div><div class="card"><span class="label">Employer-supported route</span><b>${M4.employerBridgeEvidence?'Verified in Reality Check':'No verified route carried forward'}</b></div></div></div>
${ps.length?`<div class="section"><h2>Where this career can lead</h2><div class="path">${ps.map((x,i)=>`${i?'<div class="arrow">→</div>':''}<div class="step"><span class="label">${esc(x.label)}</span><b>${esc(x.value)}</b></div>`).join('')}</div></div>`:''}
<div class="section"><h2>What supports this direction — and what still needs attention</h2><div class="twoCol"><div class="support"><b>Evidence supporting this direction</b>${list(supports())}</div><div class="attention"><b>Evidence to address or verify</b>${list(attention())}</div></div></div>
<div class="section"><h2>Your next conversation with your Career Coach</h2><div class="card">${list(coachPrompts())}</div></div>
<div class="footerNote"><b>Keep using the evidence.</b><br>Career decisions are personal and can change as you learn more. Use this report to guide employer research, networking, training conversations, and next-step planning with your Career Coach.</div></section>
<section class="coachOnly"><h2>Career Coach Summary</h2><div class="coachBox"><span class="label">Participant / Target</span><b>${esc(name)} — ${esc(target.title||C.title||SOC)} (${esc(SOC)})</b></div><div class="grid"><div class="card"><span class="label">Final route</span><b>${esc(ROUTE_NAMES[r]||r)}</b></div><div class="card"><span class="label">Module 3 mobility</span><b>${esc(SIG.lane||B.mobilityPath||'Reviewed')}</b></div><div class="card"><span class="label">Regional opportunity</span><b>${esc(B.regionalOpportunityLabel||C.regionalOpportunityLabel||'Northern evidence')}</b><span>${esc(regional())}</span></div><div class="card"><span class="label">Preparation</span><b>${esc(p.readiness)}</b><span>${esc(p.education)} • ${esc(p.ojt)}</span></div><div class="card"><span class="label">Employer-supported/WBL</span><b>${M4.employerBridgeEvidence?'Verified':'Not verified'}</b></div><div class="card"><span class="label">Interest evidence</span><b>${esc(B.interestConnection||themes().join(' • ')||'Recorded')}</b></div></div><div class="coachBox"><span class="label">Transferable strengths</span>${pills(strengths())}</div>${ps.length?`<div class="coachBox"><span class="label">Career pathway</span><b>${ps.map(x=>esc(x.value)).join(' → ')}</b></div>`:''}<div class="twoCol"><div class="support"><b>Supporting evidence</b>${list(supports())}</div><div class="attention"><b>Outstanding considerations</b>${list(attention())}</div></div><div class="coachBox"><b>Recommended coaching questions</b><ol class="coachList">${coachPrompts().map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div><div class="coachBox"><span class="label">Participant Module 4 responses</span><pre style="white-space:pre-wrap;font:inherit;margin:.35rem 0 0">${esc(Object.entries(M4.answers||{}).map(([k,v])=>`${k}: ${v}`).join('\n')||'No responses recorded')}</pre></div></section>
</div>`}
render();
const pBtn=document.getElementById('participantBtn'),cBtn=document.getElementById('coachBtn');pBtn.onclick=()=>{document.body.classList.remove('coachMode');pBtn.classList.add('active');cBtn.classList.remove('active')};cBtn.onclick=()=>{document.body.classList.add('coachMode');cBtn.classList.add('active');pBtn.classList.remove('active')};document.getElementById('printBtn').onclick=()=>window.print();
</script>
</body>
</html>
